name: CI

# Checks every push and pull request; the deploy workflows only build what they ship
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: games/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build games/backend/Mittsmodsapi.csproj -warnaserror
      # Fails if a model change was made without adding a migration
      - run: dotnet tool install --global dotnet-ef && dotnet ef migrations has-pending-model-changes --project games/backend
