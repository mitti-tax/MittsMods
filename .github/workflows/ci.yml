name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Games frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: games/frontend/package-lock.json

      - name: Install dependencies
        working-directory: games/frontend
        run: npm ci

      - name: Lint
        working-directory: games/frontend
        run: npm run lint

      - name: Typecheck and build
        working-directory: games/frontend
        run: npm run build

  backend:
    name: Games API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore games/backend/Mittsmodsapi.csproj

      - name: Build
        run: dotnet build games/backend/Mittsmodsapi.csproj --no-restore -c Release
