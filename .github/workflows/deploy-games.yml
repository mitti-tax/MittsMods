name: Deploy Games Frontend

on:
  push:
    branches: [main]
    paths:
      - "games/frontend/**"
      - ".github/workflows/deploy-games.yml"
  workflow_dispatch:

concurrency:
  group: deploy-games
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: games/frontend/package-lock.json

      # ci, not install: the deployed bundle should match the committed lockfile.
      - name: Install dependencies
        working-directory: games/frontend
        run: npm ci

      - name: Lint
        working-directory: games/frontend
        run: npm run lint

      # The API URL lives in .env.production. The secret is an optional
      # override, applied only when it is actually set — passing it through
      # unconditionally would export an empty VITE_API_URL and ship a build
      # that calls GitHub Pages instead of the API.
      - name: Build
        working-directory: games/frontend
        env:
          SECRET_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -n "$SECRET_API_URL" ]; then
            export VITE_API_URL="$SECRET_API_URL"
          fi
          npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: games/frontend/dist
          destination_dir: games
          keep_files: true
