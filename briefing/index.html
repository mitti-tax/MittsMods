<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morning briefing · MittsMods</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <style>
      .brief { max-width: 760px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
      .brief h1 { font-size: 1.4rem; font-weight: 600; text-align: center; }
      .brief h2 { font-size: 1.05rem; font-weight: 600; color: var(--green-soft); margin: 2.75rem 0 0.75rem; }
      .brief h3 { font-size: 0.95rem; color: var(--text-muted); font-weight: 500; margin: 1.5rem 0 0.5rem; }
      .bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
      .bar button { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.3rem 0.8rem; font: inherit; cursor: pointer; }
      .bar button:disabled { opacity: 0.35; cursor: default; }
      .muted { color: var(--text-muted); }
      .card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1rem 1.25rem; }
      /* UV: the Australian UV scale colours, used only for UV */
      .uv-top { display: grid; grid-template-columns: 8.5rem 1fr; gap: 1.25rem; align-items: end; }
      .uv-num { font-size: 4.75rem; font-weight: 300; line-height: 0.85; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
      .uv-band { font-weight: 600; margin-top: 0.4rem; }
      .uv-note { color: var(--text-muted); font-size: 0.875rem; line-height: 1.4; }
      .uv-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
      @media (max-width: 560px) { .uv-top { grid-template-columns: 1fr; } }
      .days { margin-top: 1.5rem; }
      .day { display: grid; grid-template-columns: 1.5rem 3rem 1fr 9.5rem; gap: 0.75rem; align-items: center; padding: 0.65rem 0; border-top: 1px solid var(--border); }
      .day svg { width: 1.4rem; height: 1.4rem; color: var(--beige); }
      .day .cond small { display: block; color: var(--text-muted); font-size: 0.8rem; line-height: 1.3; }
      .temps { display: grid; grid-template-columns: 2.2rem 1fr 2.2rem; gap: 0.4rem; align-items: center; font-variant-numeric: tabular-nums; font-size: 0.95rem; }
      .temps span:first-child { color: var(--text-muted); text-align: right; }
      .range { position: relative; height: 5px; border-radius: 3px; background: var(--bg-3); }
      .range i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, var(--beige-dim), #e8833a); }
      @media (max-width: 420px) { .day { grid-template-columns: 1.4rem 3.4rem 1fr 6.8rem; gap: 0.5rem; } .temps { grid-template-columns: 1.9rem 1fr 1.9rem; } }
      .story { margin-bottom: 1.25rem; }
      .story strong { display: block; }
      .story ul { list-style: disc; padding-left: 1.2rem; margin: 0.2rem 0; }
      .story a, .read a { color: var(--beige); text-decoration: underline; text-underline-offset: 3px; }
      .tag { font-family: var(--font-mono); font-size: 0.7rem; color: var(--bg); background: var(--beige); border-radius: var(--radius-sm); padding: 0 0.35rem; margin-right: 0.4rem; vertical-align: middle; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <nav class="nav">
        <a href="/index.html" class="nav-logo">MittsMods</a>
        <ul class="nav-links">
          <li><a href="/index.html">Home</a></li>
          <li><a href="/about.html">About</a></li>
          <li><a href="/projects.html">Projects</a></li>
        </ul>
      </nav>
    </header>

    <main class="brief">
      <div class="bar">
        <button id="prev" aria-label="Previous briefing">&larr;</button>
        <h1 id="title">Morning briefing</h1>
        <button id="next" aria-label="Next briefing">&rarr;</button>
      </div>

      <h2>Perth weather</h2>
      <div class="card" id="weather"><span class="muted">Loading…</span></div>

      <h2>Tech news</h2>
      <div id="news"><span class="muted">Loading…</span></div>

      <h2>Worth reading</h2>
      <div class="read" id="read"></div>
    </main>

    <script>
      const TZ = "Australia/Perth";
      const MAX_GAP = 7; // days to search back/forward for a briefing before giving up
      const $ = (id) => document.getElementById(id);
      const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };

      // Perth has no daylight saving, so a fixed +8h offset is exact.
      const perthToday = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
      const addDays = (iso, n) => new Date(Date.parse(iso + "T00:00:00Z") + n * 86400e3).toISOString().slice(0, 10);
      const longDate = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
      const safeUrl = (u) => (/^https?:\/\//.test(u || "") ? u : null);

      // ---------- Weather (live from Open-Meteo, no Claude involved) ----------
      const WMO = { 0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast", 45: "Fog", 48: "Fog", 51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle", 56: "Freezing drizzle", 57: "Freezing drizzle", 61: "Light rain", 63: "Rain", 65: "Heavy rain", 66: "Freezing rain", 67: "Freezing rain", 71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains", 80: "Light showers", 81: "Showers", 82: "Heavy showers", 85: "Snow showers", 86: "Snow showers", 95: "Thunderstorm", 96: "Thunderstorm, hail", 99: "Thunderstorm, hail" };
      const compass = (deg) => ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][Math.round(deg / 45) % 8];
      // Australian UV scale: [from UV, label, colour]
      const BANDS = [[0, "Low", "#5aa04a"], [3, "Moderate", "#e3c344"], [6, "High", "#e8833a"], [8, "Very high", "#d4463b"], [11, "Extreme", "#9b6cc4"]];
      const band = (u) => BANDS.filter(([f]) => Math.round(u) >= f).at(-1);
      const fmtHour = (h) => `${h % 12 || 12}${h < 12 ? "am" : "pm"}`;

      // Small stroke icons, picked by WMO code group
      const CLOUD = '<path d="M7 18h10a4 4 0 0 0 .3-8A5.5 5.5 0 0 0 6.6 11 3.5 3.5 0 0 0 7 18z"/>';
      const ICONS = {
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
        part: '<circle cx="8" cy="8" r="3"/><path d="M8 2.5v1M2.5 8h1M4.1 4.1l.7.7M11.9 4.1l-.7.7"/><path d="M9 20h8a3.5 3.5 0 0 0 .3-7 4.8 4.8 0 0 0-9.2 1.2A3 3 0 0 0 9 20z"/>',
        cloud: CLOUD,
        fog: '<path d="M4 9h16M6 13h12M4 17h16"/>',
        rain: '<g transform="translate(0 -3)">' + CLOUD + '</g><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
        storm: '<g transform="translate(0 -3)">' + CLOUD + '</g><path d="M12.5 16l-2 3h3l-2 3"/>',
      };
      const iconFor = (c) => (c <= 1 ? "sun" : c === 2 ? "part" : c === 45 || c === 48 ? "fog" : c >= 95 ? "storm" : (c >= 51 && c <= 67) || (c >= 80 && c <= 82) ? "rain" : "cloud");
      const icon = (c) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[iconFor(c)]}</svg>`;

      // Today's UV as a curve from 5am to 8pm. The fill is banded by the UV scale,
      // so the colour at any height is the colour of that UV level.
      function uvChart(vals, isToday) {
        const W = 520, H = 150, base = H - 22, top = 8, h0 = 5, h1 = 20;
        const ymax = Math.max(12, Math.ceil(Math.max(...vals)));
        const x = (h) => ((h - h0) / (h1 - h0)) * W;
        const y = (u) => base - (u / ymax) * (base - top);
        const pts = [];
        for (let h = h0; h <= h1; h++) pts.push([x(h), y(vals[h] || 0)]);
        // Catmull-Rom to cubic Bezier for a smooth line through the hourly points
        let d = `M${pts[0]}`;
        for (let i = 0; i < pts.length - 1; i++) {
          const [p0, p1, p2, p3] = [pts[i - 1] || pts[i], pts[i], pts[i + 1], pts[i + 2] || pts[i + 1]];
          d += `C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`;
        }
        // Hard stops: each band is a solid colour
        const stops = BANDS.map(([f, , c], i) => {
          const next = BANDS[i + 1] ? BANDS[i + 1][0] : ymax;
          return `<stop offset="${Math.min(f / ymax, 1)}" stop-color="${c}"/><stop offset="${Math.min(next / ymax, 1)}" stop-color="${c}"/>`;
        }).join("");
        const grad = `<linearGradient id="uvg" gradientUnits="userSpaceOnUse" x1="0" y1="${y(0)}" x2="0" y2="${y(ymax)}">${stops}</linearGradient>`;
        const ticks = [6, 9, 12, 15, 18].map((h) => `<text x="${x(h)}" y="${H - 4}" text-anchor="middle">${fmtHour(h)}</text>`).join("");
        let now = "";
        const t = new Date(Date.now() + 8 * 3600e3), nh = t.getUTCHours() + t.getUTCMinutes() / 60;
        if (isToday && nh >= h0 && nh <= h1) {
          const f = Math.floor(nh), u = vals[f] + ((vals[f + 1] ?? vals[f]) - vals[f]) * (nh - f);
          now = `<line x1="${x(nh)}" x2="${x(nh)}" y1="${top}" y2="${base}" stroke="var(--text)" stroke-opacity=".5" stroke-dasharray="2 3"/><circle cx="${x(nh)}" cy="${y(u)}" r="4.5" fill="var(--bg-2)" stroke="var(--text)" stroke-width="2"/><text x="${x(nh)}" y="${top - 1}" text-anchor="middle" fill="var(--text)">now</text>`;
        }
        return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="UV through the day, peaking at ${Math.round(Math.max(...vals))}" font-size="12" fill="var(--text-muted)" font-family="inherit">
          <defs>${grad}</defs>
          <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--border)"/>
          <path d="${d}L${x(h1)},${base}L${x(h0)},${base}Z" fill="url(#uvg)" fill-opacity=".22"/>
          <path d="${d}" fill="none" stroke="url(#uvg)" stroke-width="3" stroke-linecap="round"/>
          <line x1="0" x2="${W}" y1="${y(3)}" y2="${y(3)}" stroke="var(--text)" stroke-opacity=".35" stroke-dasharray="4 4"/>
          <text x="${W}" y="${y(3) - 5}" text-anchor="end">UV 3</text>
          ${ticks}${now}</svg>`;
      }

      async function weather() {
        const url = "https://api.open-meteo.com/v1/forecast?latitude=-31.9523&longitude=115.8613" +
          "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code,wind_speed_10m_max,wind_direction_10m_dominant,uv_index_max" +
          "&hourly=uv_index&timezone=Australia%2FPerth&forecast_days=3";
        const box = $("weather");
        try {
          const r = await fetch(url);
          if (!r.ok) throw new Error(r.status);
          const { daily: d, hourly: h } = await r.json();
          const n = (v) => Math.round(Number(v)); // everything that reaches innerHTML is a number

          // Hourly UV for today, indexed by hour 0-23
          const today = h.time.map((t, i) => [+t.slice(11, 13), Number(h.uv_index[i]) || 0, t]).filter(([, , t]) => t.startsWith(d.time[0]));
          const vals = []; today.forEach(([hr, u]) => (vals[hr] = u));
          const peak = Number(d.uv_index_max[0]);
          const [, label, colour] = band(peak);
          const cross = [];
          for (let hr = 0; hr < 23; hr++) {
            const a = vals[hr] || 0, b = vals[hr + 1] || 0;
            if ((a < 3) !== (b < 3)) cross.push(hr + (3 - a) / (b - a));
          }
          const clock = (t) => { const m = Math.round((t * 60) / 10) * 10, H = Math.floor(m / 60), M = m % 60; return `${H % 12 || 12}:${String(M).padStart(2, "0")}${H < 12 ? "am" : "pm"}`; };
          const note = cross.length >= 2 ? `Sun protection<br>${clock(cross[0])} to ${clock(cross.at(-1))}` : "No sun protection needed";

          // Shared temperature scale so the three days compare at a glance
          const lo = Math.min(...d.temperature_2m_min) - 2, hi = Math.max(...d.temperature_2m_max) + 2;
          const pct = (v) => ((v - lo) / (hi - lo)) * 100;
          const rows = [0, 1, 2].map((i) => {
            const name = i === 0 ? "Today" : new Date(d.time[i] + "T00:00:00Z").toLocaleDateString("en-AU", { weekday: "short", timeZone: "UTC" });
            const extra = i === 0 ? `<small>${n(d.precipitation_probability_max[0])}% rain, wind ${compass(Number(d.wind_direction_10m_dominant[0]))} ${n(d.wind_speed_10m_max[0])} km/h</small>` : "";
            const mn = Number(d.temperature_2m_min[i]), mx = Number(d.temperature_2m_max[i]);
            return `<div class="day">${icon(n(d.weather_code[i]))}<strong>${name}</strong>
              <div class="cond">${WMO[n(d.weather_code[i])] ?? "Code " + n(d.weather_code[i])}${extra}</div>
              <div class="temps"><span>${n(mn)}°</span><div class="range"><i style="left:${pct(mn)}%;right:${100 - pct(mx)}%"></i></div><span>${n(mx)}°</span></div></div>`;
          }).join("");

          box.innerHTML = `<div class="uv-top">
              <div><div class="uv-num">${n(peak)}</div><div class="uv-band" style="color:${colour}">${label} UV</div><div class="uv-note">${note}</div></div>
              <div class="uv-chart">${uvChart(vals, true)}</div>
            </div><div class="days">${rows}</div>`;
        } catch (e) {
          box.textContent = "";
          const a = el("a", "Couldn't load the forecast. Open the BOM Perth forecast instead."); a.href = "https://www.bom.gov.au/wa/forecasts/perth.shtml";
          box.append(a);
        }
      }

      // ---------- News (JSON written each morning by the scheduled task) ----------
      async function getBriefing(iso) {
        const r = await fetch(`data/${iso}.json`, { cache: "no-cache" });
        return r.ok ? r.json() : null;
      }
      // Walk from `iso` in direction `step` until a briefing exists (skips days the task didn't run).
      async function findBriefing(iso, step) {
        for (let i = 0; i < MAX_GAP; i++, iso = addDays(iso, step)) {
          if (step > 0 && iso > perthToday()) return null;
          const b = await getBriefing(iso);
          if (b) return b;
        }
        return null;
      }

      let current = null;
      function render(b) {
        current = b;
        history.replaceState(null, "", `?d=${b.date}`);
        $("title").textContent = longDate(b.date);
        $("next").disabled = b.date >= perthToday();

        const news = $("news"); news.textContent = "";
        if (b.slow_day) news.append(el("p", "Slow news day.", "muted"));
        for (const sec of b.sections || []) {
          news.append(el("h3", sec.name));
          for (const s of sec.stories) {
            const div = el("div", null, "story");
            const head = el("strong");
            if (s.update) head.append(el("span", "UPDATE", "tag"));
            head.append(s.headline);
            const ul = el("ul");
            for (const p of s.points) ul.append(el("li", p));
            div.append(head, ul);
            if (safeUrl(s.url)) { const a = el("a", "Read more"); a.href = s.url; a.target = "_blank"; a.rel = "noopener"; div.append(a); }
            news.append(div);
          }
        }

        const read = $("read"); read.textContent = "";
        if (b.read && safeUrl(b.read.url)) {
          const a = el("a", "Read more"); a.href = b.read.url; a.target = "_blank"; a.rel = "noopener";
          read.append(el("strong", b.read.title), el("p", b.read.why), a);
        }
      }

      async function show(iso, step) {
        const b = await findBriefing(iso, step);
        if (b) render(b);
        else if (!current) $("news").textContent = "No briefing found for the last week.";
      }

      $("prev").onclick = () => current && show(addDays(current.date, -1), -1);
      $("next").onclick = () => current && show(addDays(current.date, 1), 1);

      weather();
      const asked = new URLSearchParams(location.search).get("d");
      show(/^\d{4}-\d{2}-\d{2}$/.test(asked || "") ? asked : perthToday(), -1);
    </script>
  </body>
</html>
