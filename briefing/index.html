<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morning briefing · MittsMods</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <style>
      .brief { max-width: 760px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
      .brief h1 { font-size: 1.4rem; font-weight: 600; text-align: center; }
      .brief h2 { font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--green-soft); margin: 2.5rem 0 0.75rem; }
      .brief h3 { font-size: 0.95rem; color: var(--text-muted); font-weight: 500; margin: 1.5rem 0 0.5rem; }
      .bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
      .bar button { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.3rem 0.8rem; font: inherit; cursor: pointer; }
      .bar button:disabled { opacity: 0.35; cursor: default; }
      .muted { color: var(--text-muted); }
      .card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1rem 1.25rem; }
      .uv { font-size: 2.2rem; font-weight: 600; line-height: 1; }
      .wx { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 1.25rem; align-items: baseline; }
      .story { margin-bottom: 1.25rem; }
      .story strong { display: block; }
      .story ul { list-style: disc; padding-left: 1.2rem; margin: 0.2rem 0; }
      .story a, .read a { color: var(--beige); text-decoration: underline; text-underline-offset: 3px; }
      .tag { font-family: var(--font-mono); font-size: 0.7rem; color: var(--bg); background: var(--beige); border-radius: var(--radius-sm); padding: 0 0.35rem; margin-right: 0.4rem; vertical-align: middle; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <nav class="nav">
        <a href="/index.html" class="nav-logo">MittsMods</a>
        <ul class="nav-links">
          <li><a href="/index.html">Home</a></li>
          <li><a href="/about.html">About</a></li>
          <li><a href="/projects.html">Projects</a></li>
        </ul>
      </nav>
    </header>

    <main class="brief">
      <div class="bar">
        <button id="prev" aria-label="Previous briefing">&larr;</button>
        <h1 id="title">Morning briefing</h1>
        <button id="next" aria-label="Next briefing">&rarr;</button>
      </div>

      <h2>Weather · Perth</h2>
      <div class="card" id="weather"><span class="muted">Loading…</span></div>

      <h2>Tech news</h2>
      <div id="news"><span class="muted">Loading…</span></div>

      <h2>One thing worth reading</h2>
      <div class="read" id="read"></div>
    </main>

    <script>
      const TZ = "Australia/Perth";
      const MAX_GAP = 7; // days to search back/forward for a briefing before giving up
      const $ = (id) => document.getElementById(id);
      const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };

      // Perth has no daylight saving, so a fixed +8h offset is exact.
      const perthToday = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
      const addDays = (iso, n) => new Date(Date.parse(iso + "T00:00:00Z") + n * 86400e3).toISOString().slice(0, 10);
      const longDate = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
      const safeUrl = (u) => (/^https?:\/\//.test(u || "") ? u : null);

      // ---------- Weather (live from Open-Meteo, no Claude involved) ----------
      const WMO = { 0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast", 45: "Fog", 48: "Fog", 51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle", 56: "Freezing drizzle", 57: "Freezing drizzle", 61: "Light rain", 63: "Rain", 65: "Heavy rain", 66: "Freezing rain", 67: "Freezing rain", 71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains", 80: "Light showers", 81: "Showers", 82: "Heavy showers", 85: "Snow showers", 86: "Snow showers", 95: "Thunderstorm", 96: "Thunderstorm, hail", 99: "Thunderstorm, hail" };
      const compass = (deg) => ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][Math.round(deg / 45) % 8];
      const uvLabel = (u) => (u < 3 ? "Low" : u < 6 ? "Moderate" : u < 8 ? "High" : u < 11 ? "Very high" : "Extreme");
      const hour = (t) => { const h = +t.slice(11, 13); return `${h % 12 || 12}${h < 12 ? "am" : "pm"}`; };

      async function weather() {
        const url = "https://api.open-meteo.com/v1/forecast?latitude=-31.9523&longitude=115.8613" +
          "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code,wind_speed_10m_max,wind_direction_10m_dominant,uv_index_max" +
          "&hourly=uv_index&timezone=Australia%2FPerth&forecast_days=3";
        const box = $("weather");
        try {
          const r = await fetch(url);
          if (!r.ok) throw new Error(r.status);
          const { daily: d, hourly: h } = await r.json();
          box.textContent = "";

          // UV first: peak plus the sun-protection window (UV 3+), same rule BOM uses.
          const today = h.time.map((t, i) => [t, h.uv_index[i]]).filter(([t]) => t.startsWith(d.time[0]));
          const high = today.filter(([, u]) => u >= 3);
          const uvRow = el("div"); uvRow.style.marginBottom = "0.75rem";
          uvRow.append(el("span", `UV ${Math.round(d.uv_index_max[0])}`, "uv"), el("span", `  ${uvLabel(d.uv_index_max[0])}`));
          uvRow.append(el("div", high.length ? `Sun protection ${hour(high[0][0])} to ${hour(high.at(-1)[0])}` : "No sun protection needed", "muted"));
          box.append(uvRow);

          const grid = el("div", null, "wx");
          for (let i = 0; i < 3; i++) {
            const label = i === 0 ? "Today" : new Date(d.time[i] + "T00:00:00Z").toLocaleDateString("en-AU", { weekday: "short", timeZone: "UTC" });
            let line = `${Math.round(d.temperature_2m_min[i])}° to ${Math.round(d.temperature_2m_max[i])}°, ${WMO[d.weather_code[i]] ?? "Code " + d.weather_code[i]}`;
            if (i === 0) line += `, ${d.precipitation_probability_max[0]}% rain, wind ${Math.round(d.wind_speed_10m_max[0])} km/h ${compass(d.wind_direction_10m_dominant[0])}`;
            grid.append(el("strong", label), el("span", line));
          }
          box.append(grid);
        } catch (e) {
          box.textContent = "";
          const a = el("a", "Weather fetch failed. Open the BOM Perth forecast."); a.href = "https://www.bom.gov.au/wa/forecasts/perth.shtml";
          box.append(a);
        }
      }

      // ---------- News (JSON written each morning by the scheduled task) ----------
      async function getBriefing(iso) {
        const r = await fetch(`data/${iso}.json`, { cache: "no-cache" });
        return r.ok ? r.json() : null;
      }
      // Walk from `iso` in direction `step` until a briefing exists (skips days the task didn't run).
      async function findBriefing(iso, step) {
        for (let i = 0; i < MAX_GAP; i++, iso = addDays(iso, step)) {
          if (step > 0 && iso > perthToday()) return null;
          const b = await getBriefing(iso);
          if (b) return b;
        }
        return null;
      }

      let current = null;
      function render(b) {
        current = b;
        history.replaceState(null, "", `?d=${b.date}`);
        $("title").textContent = longDate(b.date);
        $("next").disabled = b.date >= perthToday();

        const news = $("news"); news.textContent = "";
        if (b.slow_day) news.append(el("p", "Slow news day.", "muted"));
        for (const sec of b.sections || []) {
          news.append(el("h3", sec.name));
          for (const s of sec.stories) {
            const div = el("div", null, "story");
            const head = el("strong");
            if (s.update) head.append(el("span", "UPDATE", "tag"));
            head.append(s.headline);
            const ul = el("ul");
            for (const p of s.points) ul.append(el("li", p));
            div.append(head, ul);
            if (safeUrl(s.url)) { const a = el("a", "Read more"); a.href = s.url; a.target = "_blank"; a.rel = "noopener"; div.append(a); }
            news.append(div);
          }
        }

        const read = $("read"); read.textContent = "";
        if (b.read && safeUrl(b.read.url)) {
          const a = el("a", "Read more"); a.href = b.read.url; a.target = "_blank"; a.rel = "noopener";
          read.append(el("strong", b.read.title), el("p", b.read.why), a);
        }
      }

      async function show(iso, step) {
        const b = await findBriefing(iso, step);
        if (b) render(b);
        else if (!current) $("news").textContent = "No briefing found for the last week.";
      }

      $("prev").onclick = () => current && show(addDays(current.date, -1), -1);
      $("next").onclick = () => current && show(addDays(current.date, 1), 1);

      weather();
      const asked = new URLSearchParams(location.search).get("d");
      show(/^\d{4}-\d{2}-\d{2}$/.test(asked || "") ? asked : perthToday(), -1);
    </script>
  </body>
</html>
